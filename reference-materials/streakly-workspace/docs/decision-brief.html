<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision brief, P2L4</title>
<style>
  :root { --ink:#1b1d22; --mut:#6b7280; --line:#e5e6ea; --bg:#f4f4f2; }
  * { box-sizing: border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; margin:0; color:var(--ink); background:#fff; }
  .wrap { max-width:820px; margin:0 auto; padding:32px 20px 56px; }
  .eyebrow { font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); margin:0 0 6px; }
  .src { font-size:12.5px; color:var(--mut); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; margin:0 0 20px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .doc { font-size:14.5px; line-height:1.62; color:#3b3b39; }
  .doc h1 { font-size:22px; font-weight:600; color:var(--ink); margin:0 0 10px; }
  .doc h2 { font-size:16.5px; font-weight:600; color:var(--ink); margin:28px 0 8px; padding-top:16px; border-top:1px solid var(--line); }
  .doc h3 { font-size:14.5px; font-weight:600; color:var(--ink); margin:22px 0 6px; }
  .doc p { margin:0 0 12px; }
  .doc ul, .doc ol { margin:0 0 12px; padding-left:22px; }
  .doc li { margin-bottom:6px; }
  .doc blockquote { margin:0 0 14px; padding:10px 14px; background:var(--bg); border-radius:8px; font-size:13.5px; color:#4b4b48; }
  .doc blockquote p:last-child { margin-bottom:0; }
  .doc hr { border:0; border-top:1px solid var(--line); margin:24px 0; }
  .doc code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; background:var(--bg); padding:1px 5px; border-radius:4px; color:#3a3a37; }
  .doc strong { color:var(--ink); }
  .doc a { color:#1f5fa8; text-decoration:none; border-bottom:1px solid #cddcee; }
  .tw { overflow-x:auto; margin:0 0 14px; }
  .doc table { border-collapse:collapse; font-size:13px; min-width:100%; }
  .doc th { text-align:left; font-weight:600; color:var(--mut); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); padding:7px 12px 7px 0; white-space:nowrap; }
  .doc td { border-top:1px solid var(--line); padding:9px 12px 9px 0; vertical-align:top; }
  @media print { .wrap { padding:0; max-width:none; } }
</style>

<body>
<div class="wrap">
  <p class="eyebrow">P2L4 &nbsp;·&nbsp; P2, Know Your Users</p>
  <p class="src">streakly/docs/decision-brief.md</p>
  <div class="doc" id="doc"></div>
</div>
<script type="application/json" id="data">"# Decision Brief: The Comeback Experience\n\n> **For:** Marcus, Head of Product\n> **Sources:** research/interview-synthesis.md, research/nps-analysis.md,\n> research/competitive-matrix.md, research/competitive-reddit.md\n\n## Situation\n\nDay-7 retention dropped from 48% to 39% after the v2 streak/notification redesign,\nand once a user breaks a streak, most never come back. Across every research source\nwe have, the same root cause surfaces: the reset is all-or-nothing and there is no\nway back in.\n\n## Key Findings\n\n1. **The punishing reset is the single largest theme in unprompted feedback.** 6 of\n   10 NPS comments cite it directly, and 2 name a streak-freeze as the fix they\n   want by feature name. (`research/nps-analysis.md`)\n2. **Interviews show users hit the punishing side of the mechanic before they ever\n   reach a rewarding one.** Priya's positive \"look what you built\" moment took\n   about 3 weeks; Amara is already anxious at day 4, and Tom churned at week 5,\n   both well before Priya's arc. (`research/interview-synthesis.md`)\n3. **Notification fatigue is a real but secondary theme, and it's self-defeating.**\n   2 of 10 NPS comments cite nagging or random notifications, and both say they\n   turned notifications off entirely, closing the one channel that could otherwise\n   win them back. (`research/nps-analysis.md`)\n4. **No competitor offers a free, personal comeback moment after an unplanned\n   miss.** Duolingo has a paid streak-repair mechanic; Babbel, Elevate, and\n   Habitica have no reactive comeback flow at all. (`research/competitive-matrix.md`)\n5. **Lower-confidence Reddit/aggregator sentiment does not contradict finding 4,\n   and arguably strengthens it:** secondhand sources report Duolingo users\n   resenting that its forgiveness mechanic is paywalled, not just that a miss\n   resets the streak. This finding carries materially lower confidence than 1-4,\n   no primary Reddit threads were accessible, everything here is aggregator\n   commentary. (`research/competitive-reddit.md`)\n\n## Options Considered\n\n- **A. Status quo.** Keep iterating on the current reset flow. Risk: every source\n  above already shows this is failing, and it's the path most likely to keep\n  losing the users we're trying to save.\n- **B. Ship the personalized Comeback screen** (best-streak stat, 60-second\n  comeback lesson, one-tap streak-freeze), the concept Lena sketched and Raj\n  called technically feasible with no new data sources.\n- **C. Fix notification tone and frequency only.** Cheaper, but does not address\n  the larger and more consistently confirmed theme, the irreversible reset itself.\n\n## Recommended Action\n\nMove forward with Option B, the personalized Comeback screen, as the primary bet\ninto discovery.\n\n## Why Now\n\nThe reset theme is the largest, most consistently confirmed finding across every\nsource available (interviews, NPS, and competitive research), and it's white\nspace no competitor has claimed for free. Waiting risks designing a fix aimed at\nthe smaller theme (notifications) while the dominant driver of the 9-point\nretention drop goes unaddressed.\n"</script>
<script>
(function(){
  var MD = JSON.parse(document.getElementById('data').textContent);
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inl(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function(m,a){ return '<code>'+a+'</code>'; });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*]+)\*/g, '$1<em>$2</em>');
    return s;
  }
  function row(line){ return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(x){ return x.trim(); }); }
  function isSep(line){ return /^\s*\|[\s:|-]+\|\s*$/.test(line); }
  function render(md){
    var L = md.split('\n'), out = [], i = 0;
    while(i < L.length){
      var ln = L[i];
      if(/^\s*$/.test(ln)){ i++; continue; }
      if(/^---+\s*$/.test(ln)){ out.push('<hr>'); i++; continue; }
      var h = ln.match(/^(#{1,6})\s+(.*)$/);
      if(h){ var n = h[1].length; out.push('<h'+n+'>'+inl(h[2])+'</h'+n+'>'); i++; continue; }
      if(/^>\s?/.test(ln)){
        var q = [];
        while(i < L.length && /^>\s?/.test(L[i])){ q.push(L[i].replace(/^>\s?/,'')); i++; }
        out.push('<blockquote>'+render(q.join('\n'))+'</blockquote>'); continue;
      }
      if(/^\s*\|/.test(ln) && i+1 < L.length && isSep(L[i+1])){
        var head = row(ln); i += 2; var body = [];
        while(i < L.length && /^\s*\|/.test(L[i])){ body.push(row(L[i])); i++; }
        var t = '<div class="tw"><table><thead><tr>'+head.map(function(c){ return '<th>'+inl(c)+'</th>'; }).join('')+'</tr></thead><tbody>';
        t += body.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+inl(c)+'</td>'; }).join('')+'</tr>'; }).join('');
        out.push(t+'</tbody></table></div>'); continue;
      }
      var lm = ln.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
      if(lm){
        var ordered = /\d/.test(lm[2]); var items = [], cur = null;
        while(i < L.length){
          var m2 = L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
          if(m2){ if(cur) items.push(cur); cur = [m2[3]]; i++; continue; }
          if(/^\s+\S/.test(L[i]) && cur){ cur.push(L[i].trim()); i++; continue; }
          if(/^\s*$/.test(L[i]) && i+1 < L.length && /^(\s*)([-*]|\d+\.)\s+/.test(L[i+1])){ i++; continue; }
          break;
        }
        if(cur) items.push(cur);
        var tag = ordered ? 'ol' : 'ul';
        out.push('<'+tag+'>'+items.map(function(it){ return '<li>'+inl(it.join(' '))+'</li>'; }).join('')+'</'+tag+'>');
        continue;
      }
      var p = [];
      while(i < L.length && !/^\s*$/.test(L[i]) && !/^(#{1,6}\s|>|---+\s*$)/.test(L[i]) && !/^\s*\|/.test(L[i]) && !/^(\s*)([-*]|\d+\.)\s+/.test(L[i])){ p.push(L[i].trim()); i++; }
      if(p.length) out.push('<p>'+inl(p.join(' '))+'</p>');
    }
    return out.join('\n');
  }
  document.getElementById('doc').innerHTML = render(MD);
})();
</script>
</body>
</html>
