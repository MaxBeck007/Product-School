<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview synthesis, P2L1</title>
<style>
  :root { --ink:#1b1d22; --mut:#6b7280; --line:#e5e6ea; --bg:#f4f4f2; }
  * { box-sizing: border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; margin:0; color:var(--ink); background:#fff; }
  .wrap { max-width:820px; margin:0 auto; padding:32px 20px 56px; }
  .eyebrow { font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); margin:0 0 6px; }
  .src { font-size:12.5px; color:var(--mut); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; margin:0 0 20px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .doc { font-size:14.5px; line-height:1.62; color:#3b3b39; }
  .doc h1 { font-size:22px; font-weight:600; color:var(--ink); margin:0 0 10px; }
  .doc h2 { font-size:16.5px; font-weight:600; color:var(--ink); margin:28px 0 8px; padding-top:16px; border-top:1px solid var(--line); }
  .doc h3 { font-size:14.5px; font-weight:600; color:var(--ink); margin:22px 0 6px; }
  .doc p { margin:0 0 12px; }
  .doc ul, .doc ol { margin:0 0 12px; padding-left:22px; }
  .doc li { margin-bottom:6px; }
  .doc blockquote { margin:0 0 14px; padding:10px 14px; background:var(--bg); border-radius:8px; font-size:13.5px; color:#4b4b48; }
  .doc blockquote p:last-child { margin-bottom:0; }
  .doc hr { border:0; border-top:1px solid var(--line); margin:24px 0; }
  .doc code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; background:var(--bg); padding:1px 5px; border-radius:4px; color:#3a3a37; }
  .doc strong { color:var(--ink); }
  .doc a { color:#1f5fa8; text-decoration:none; border-bottom:1px solid #cddcee; }
  .tw { overflow-x:auto; margin:0 0 14px; }
  .doc table { border-collapse:collapse; font-size:13px; min-width:100%; }
  .doc th { text-align:left; font-weight:600; color:var(--mut); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); padding:7px 12px 7px 0; white-space:nowrap; }
  .doc td { border-top:1px solid var(--line); padding:9px 12px 9px 0; vertical-align:top; }
  @media print { .wrap { padding:0; max-width:none; } }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">P2L1 &nbsp;·&nbsp; P2, Know Your Users</p>
  <p class="src">streakly/research/interview-synthesis.md</p>
  <div class="doc" id="doc"></div>
</div>
<script type="application/json" id="data">"# Interview Synthesis: Priya, Tom, Amara\n\n> **Source:** three user interview excerpts provided in the P2L1 exercise (Product School\n> course workspace). Verified: quotes below are copied verbatim from the source excerpts.\n> Where a theme surfaces in only one interview, that is called out rather than padded\n> with a second person's quote.\n\n## Participants\n\n| Name | Segment |\n| --- | --- |\n| Priya S. | Power user, 14-month streak |\n| Tom R. | Churned user, broke a 12-day streak at week 5, left |\n| Amara L. | New user, 4 days in |\n\n---\n\n## Top 5 themes\n\n### 1. The reset feels all-or-nothing, whether it has already happened or is only feared\n\n- Tom: \"I got to a 12-day streak and I was proud of it. Then I traveled for work, missed\n  two days, and came back to a big fat zero.\"\n- Amara: \"I don't want to lose everything I've built after four days.\"\n\n*Single source per quote, but the same fear shows up on both sides of an actual break:\nTom describing it after the fact, Amara anticipating it before it happens to her.*\n\n### 2. Once broken, there is no path back in\n\n*Single source: only Tom has been through a break, so both quotes are his.*\n\n- Tom: \"There was no way to recover it, nothing. So I gave up.\"\n- Tom: \"I switched to Duolingo, at least there a missed day doesn't wipe everything, and\n  a streak freeze feels forgiving.\"\n\n### 3. The notification that announces the loss adds guilt on top of the loss\n\n*Single source, single quote. Only Tom mentions notification tone directly; there is\nno second quote to pair it with without inventing one.*\n\n- Tom: \"The app sent me this 'you lost your streak' notification that just made me\n  feel bad.\"\n\n### 4. Streak anxiety starts long before any streak is actually broken\n\n*Single source: Amara.*\n\n- Amara: \"I'm already stressed about the streak, I keep thinking, what happens if I\n  miss a day?\"\n- Amara: \"the pressure is starting to feel like a chore instead of a game.\"\n\n### 5. Acknowledging progress is what makes the habit stick, not the streak count alone\n\n*Single source: Priya. Included because it is the positive counter-case, what\nretention looks like when the same mechanic works.*\n\n- Priya: \"The thing that made it stick was hitting a 30-day streak and the app actually\n  celebrating it, that little moment of 'look what you built.'\"\n- Priya: \"After that I did not want to lose it.\"\n\n---\n\n## Contradictions and tensions\n\n- **Same mechanic, opposite effect depending on where the user is in the journey.**\n  Priya experienced the streak as a source of pride once she reached 30 days and got\n  acknowledged. Tom and Amara experienced the identical mechanic (an unbroken counter,\n  reset on failure) as a threat before they ever got a positive moment from it.\n- **The reinforcing moment comes later than the punishing one.** Priya says it took\n  \"about three weeks\" to feel the habit stick. Amara is anxious at day 4. Tom churned\n  at week 5. Both churn points land well before Priya's three-week mark, so the\n  interviews suggest users are exposed to the punishing side of the mechanic before\n  they have a chance to reach the celebrated side.\n- **Priya's own caveat undercuts her as a template.** She adds, unprompted: \"I think\n  most people quit long before the habit forms.\" She is naming the survivorship bias\n  in her own story.\n\n---\n\n## The single most important insight for week-1 retention\n\nThe streak mechanic is not broken for everyone, it is broken for people who hit the\npunishing side of it before they reach the rewarding side. Priya's positive\nexperience only arrived after roughly three weeks; Amara is already anxious at day 4,\nand Tom's churn point (12-day streak, week 5) came well before any acknowledgment\nmoment like Priya's. For week-1 retention specifically, users are almost guaranteed to\nhit a missed day before they ever get a \"look what you built\" moment. The interviews\nsupport prioritizing acknowledgment and a way back in early, not just protecting\nstreaks that are already long.\n"</script>
<script>
(function(){
  var MD = JSON.parse(document.getElementById('data').textContent);
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inl(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function(m,a){ return '<code>'+a+'</code>'; });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*]+)\*/g, '$1<em>$2</em>');
    return s;
  }
  function row(line){ return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(x){ return x.trim(); }); }
  function isSep(line){ return /^\s*\|[\s:|-]+\|\s*$/.test(line); }
  function render(md){
    var L = md.split('\n'), out = [], i = 0;
    while(i < L.length){
      var ln = L[i];
      if(/^\s*$/.test(ln)){ i++; continue; }
      if(/^---+\s*$/.test(ln)){ out.push('<hr>'); i++; continue; }
      var h = ln.match(/^(#{1,6})\s+(.*)$/);
      if(h){ var n = h[1].length; out.push('<h'+n+'>'+inl(h[2])+'</h'+n+'>'); i++; continue; }
      if(/^>\s?/.test(ln)){
        var q = [];
        while(i < L.length && /^>\s?/.test(L[i])){ q.push(L[i].replace(/^>\s?/,'')); i++; }
        out.push('<blockquote>'+render(q.join('\n'))+'</blockquote>'); continue;
      }
      if(/^\s*\|/.test(ln) && i+1 < L.length && isSep(L[i+1])){
        var head = row(ln); i += 2; var body = [];
        while(i < L.length && /^\s*\|/.test(L[i])){ body.push(row(L[i])); i++; }
        var t = '<div class="tw"><table><thead><tr>'+head.map(function(c){ return '<th>'+inl(c)+'</th>'; }).join('')+'</tr></thead><tbody>';
        t += body.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+inl(c)+'</td>'; }).join('')+'</tr>'; }).join('');
        out.push(t+'</tbody></table></div>'); continue;
      }
      var lm = ln.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
      if(lm){
        var ordered = /\d/.test(lm[2]); var items = [], cur = null;
        while(i < L.length){
          var m2 = L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
          if(m2){ if(cur) items.push(cur); cur = [m2[3]]; i++; continue; }
          if(/^\s+\S/.test(L[i]) && cur){ cur.push(L[i].trim()); i++; continue; }
          if(/^\s*$/.test(L[i]) && i+1 < L.length && /^(\s*)([-*]|\d+\.)\s+/.test(L[i+1])){ i++; continue; }
          break;
        }
        if(cur) items.push(cur);
        var tag = ordered ? 'ol' : 'ul';
        out.push('<'+tag+'>'+items.map(function(it){ return '<li>'+inl(it.join(' '))+'</li>'; }).join('')+'</'+tag+'>');
        continue;
      }
      var p = [];
      while(i < L.length && !/^\s*$/.test(L[i]) && !/^(#{1,6}\s|>|---+\s*$)/.test(L[i]) && !/^\s*\|/.test(L[i]) && !/^(\s*)([-*]|\d+\.)\s+/.test(L[i])){ p.push(L[i].trim()); i++; }
      if(p.length) out.push('<p>'+inl(p.join(' '))+'</p>');
    }
    return out.join('\n');
  }
  document.getElementById('doc').innerHTML = render(MD);
})();
</script>
</body>
</html>
