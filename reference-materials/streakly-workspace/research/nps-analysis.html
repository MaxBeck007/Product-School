<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPS verbatim analysis, P2L2</title>
<style>
  :root { --ink:#1b1d22; --mut:#6b7280; --line:#e5e6ea; --bg:#f4f4f2; }
  * { box-sizing: border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; margin:0; color:var(--ink); background:#fff; }
  .wrap { max-width:820px; margin:0 auto; padding:32px 20px 56px; }
  .eyebrow { font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); margin:0 0 6px; }
  .src { font-size:12.5px; color:var(--mut); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; margin:0 0 20px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .doc { font-size:14.5px; line-height:1.62; color:#3b3b39; }
  .doc h1 { font-size:22px; font-weight:600; color:var(--ink); margin:0 0 10px; }
  .doc h2 { font-size:16.5px; font-weight:600; color:var(--ink); margin:28px 0 8px; padding-top:16px; border-top:1px solid var(--line); }
  .doc h3 { font-size:14.5px; font-weight:600; color:var(--ink); margin:22px 0 6px; }
  .doc p { margin:0 0 12px; }
  .doc ul, .doc ol { margin:0 0 12px; padding-left:22px; }
  .doc li { margin-bottom:6px; }
  .doc blockquote { margin:0 0 14px; padding:10px 14px; background:var(--bg); border-radius:8px; font-size:13.5px; color:#4b4b48; }
  .doc blockquote p:last-child { margin-bottom:0; }
  .doc hr { border:0; border-top:1px solid var(--line); margin:24px 0; }
  .doc code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; background:var(--bg); padding:1px 5px; border-radius:4px; color:#3a3a37; }
  .doc strong { color:var(--ink); }
  .doc a { color:#1f5fa8; text-decoration:none; border-bottom:1px solid #cddcee; }
  .tw { overflow-x:auto; margin:0 0 14px; }
  .doc table { border-collapse:collapse; font-size:13px; min-width:100%; }
  .doc th { text-align:left; font-weight:600; color:var(--mut); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); padding:7px 12px 7px 0; white-space:nowrap; }
  .doc td { border-top:1px solid var(--line); padding:9px 12px 9px 0; vertical-align:top; }
  @media print { .wrap { padding:0; max-width:none; } }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">P2L2 &nbsp;·&nbsp; P2, Know Your Users</p>
  <p class="src">streakly/research/nps-analysis.md</p>
  <div class="doc" id="doc"></div>
</div>
<script type="application/json" id="data">"# NPS Verbatim Analysis\n\n> **Source:** 10 raw NPS comments provided in the P2L2 exercise.\n> **Method:** each comment tagged to one or more themes; mention counts are of\n> comments, not quotes (a comment can carry more than one theme).\n\n## Themes mentioned more than once, ranked by frequency\n\n| Rank | Theme | Mentions | Comments |\n| --- | --- | --- | --- |\n| 1 | Streak reset to zero is punishing and kills motivation | 6 | \"I hit a 20-day streak, missed one day, and it reset to zero. I haven't opened the app since. Felt pointless to start over.\" / \"I want Streakly to feel like a coach... not a scorekeeper that punishes me\" / \"I broke my streak once and there was no way to recover it. Other apps let you freeze a streak. Why not this one?\" / \"I wish it would make coming back easier instead of making me feel like I failed and have to start from scratch.\" / \"Deleted after 3 weeks. The moment I lost my streak the whole thing lost its meaning.\" / \"The streak is the only thing keeping me engaged, but the second I lost it, I was done.\" |\n| 2 | No recovery mechanism, streak-freeze requested by name | 2 | \"Other apps let you freeze a streak. Why not this one?\" / \"I wish it would make coming back easier instead of making me feel like I failed and have to start from scratch.\" |\n| 2 | Notifications feel like nagging or arrive at random | 2 | \"After that the daily reminder just started to feel like nagging.\" / \"The notifications feel random. I got three in one afternoon and just turned them all off.\" |\n| 2 | Lesson content itself is well liked | 2 | \"The first week was genuinely fun.\" / \"Love the lessons.\" |\n\n`Note:` rows 2-4 tie at 2 mentions each. Rank 2 (freeze) is the specific, actionable\nsubset of rank 1 (punishing reset), not a separate cause, listed separately because it\nnames a concrete fix.\n\n## Single mentions worth flagging (not ranked, but relevant to the actionable list below)\n\n- \"The home screen looks the same whether I'm on a 2-day streak or coming back after\n  two weeks away. Nothing acknowledges where I am.\" (no personalization of state)\n- \"I just forget it exists after a couple of days. If it pulled me back with something\n  useful I'd come back.\" (users want a specific reason to return, not a reminder)\n\n---\n\n## Praise vs. complaints\n\n**Praise (2 comments):**\n- \"The first week was genuinely fun.\"\n- \"Love the lessons.\"\n\n**Complaints (8 comments):** everything else. The volume is heavily skewed toward\ncomplaints about the reset mechanic and notifications, not the core lesson content.\n`Guess:` this suggests the retention problem is about what happens around the habit\nloop (streak, notifications), not the daily lesson itself. **What would confirm it:**\nsession-length or lesson-completion data showing users who churn still finished their\nlessons before leaving.\n\n---\n\n## Top 3 actionable issues\n\n1. **No way back in after a break.** Named directly, by feature name (streak freeze),\n   in 2 of 10 comments, and it's the mechanism underneath the single largest\n   theme (6 mentions).\n2. **Notification tone and frequency are working against retention, not for it.**\n   2 comments describe nagging or randomness; both describe turning notifications off\n   entirely, which cuts off the channel Streakly would need to bring lapsed users back.\n3. **The app does not recognize where a user is when they return.** Only 1 comment\n   states this directly, but it is the one comment that names the specific gap: no\n   acknowledgment of state on the home screen. `Assumption:` grouping this with the\n   \"pull me back with something useful\" comment as the same underlying ask.\n   **What would confirm it:** a follow-up NPS or usability prompt asking returning\n   users directly whether the home screen felt like it recognized their history.\n\n---\n\n## Findings report for Marcus\n\n**Situation:** 10 unprompted NPS comments were reviewed for recurring themes.\n\n**What we found:** the dominant complaint, by a wide margin, is that breaking a streak\nresets everything to zero with no way back, showing up in 6 of 10 comments. Two users\nname the fix by feature: a streak freeze, the same feature competitors already offer.\nNotification fatigue is the second complaint theme (2 comments), and both of those\nusers say they turned notifications off entirely. Praise is limited to the lesson\ncontent itself (2 comments), not the retention mechanics.\n\n**What this means:** the two complaint themes point in the same direction as the\ninterview synthesis (`research/interview-synthesis.md`): users are not leaving because\nthe lessons are bad, they are leaving because the app punishes a miss and then has no\nchannel left to win them back once they've turned notifications off.\n"</script>
<script>
(function(){
  var MD = JSON.parse(document.getElementById('data').textContent);
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inl(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function(m,a){ return '<code>'+a+'</code>'; });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*]+)\*/g, '$1<em>$2</em>');
    return s;
  }
  function row(line){ return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(x){ return x.trim(); }); }
  function isSep(line){ return /^\s*\|[\s:|-]+\|\s*$/.test(line); }
  function render(md){
    var L = md.split('\n'), out = [], i = 0;
    while(i < L.length){
      var ln = L[i];
      if(/^\s*$/.test(ln)){ i++; continue; }
      if(/^---+\s*$/.test(ln)){ out.push('<hr>'); i++; continue; }
      var h = ln.match(/^(#{1,6})\s+(.*)$/);
      if(h){ var n = h[1].length; out.push('<h'+n+'>'+inl(h[2])+'</h'+n+'>'); i++; continue; }
      if(/^>\s?/.test(ln)){
        var q = [];
        while(i < L.length && /^>\s?/.test(L[i])){ q.push(L[i].replace(/^>\s?/,'')); i++; }
        out.push('<blockquote>'+render(q.join('\n'))+'</blockquote>'); continue;
      }
      if(/^\s*\|/.test(ln) && i+1 < L.length && isSep(L[i+1])){
        var head = row(ln); i += 2; var body = [];
        while(i < L.length && /^\s*\|/.test(L[i])){ body.push(row(L[i])); i++; }
        var t = '<div class="tw"><table><thead><tr>'+head.map(function(c){ return '<th>'+inl(c)+'</th>'; }).join('')+'</tr></thead><tbody>';
        t += body.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+inl(c)+'</td>'; }).join('')+'</tr>'; }).join('');
        out.push(t+'</tbody></table></div>'); continue;
      }
      var lm = ln.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
      if(lm){
        var ordered = /\d/.test(lm[2]); var items = [], cur = null;
        while(i < L.length){
          var m2 = L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
          if(m2){ if(cur) items.push(cur); cur = [m2[3]]; i++; continue; }
          if(/^\s+\S/.test(L[i]) && cur){ cur.push(L[i].trim()); i++; continue; }
          if(/^\s*$/.test(L[i]) && i+1 < L.length && /^(\s*)([-*]|\d+\.)\s+/.test(L[i+1])){ i++; continue; }
          break;
        }
        if(cur) items.push(cur);
        var tag = ordered ? 'ol' : 'ul';
        out.push('<'+tag+'>'+items.map(function(it){ return '<li>'+inl(it.join(' '))+'</li>'; }).join('')+'</'+tag+'>');
        continue;
      }
      var p = [];
      while(i < L.length && !/^\s*$/.test(L[i]) && !/^(#{1,6}\s|>|---+\s*$)/.test(L[i]) && !/^\s*\|/.test(L[i]) && !/^(\s*)([-*]|\d+\.)\s+/.test(L[i])){ p.push(L[i].trim()); i++; }
      if(p.length) out.push('<p>'+inl(p.join(' '))+'</p>');
    }
    return out.join('\n');
  }
  document.getElementById('doc').innerHTML = render(MD);
})();
</script>
</body>
</html>
